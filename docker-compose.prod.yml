services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/zhenzhi_agent.db
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OUTPUT_DIR: /app/output
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - db_data:/app/data
      - app_output:/app/output
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    networks: [app_net]
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  photocraft:
    image: zhenzhi-photocraft-web:0.23.1
    build:
      context: ./photocraft
      args:
        PHOTOCRAFT_VERSION: 0.23.1
    networks: [app_net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_API_URL: http://backend:8000
      PHOTOCRAFT_URL: http://photocraft:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      photocraft:
        condition: service_healthy
    networks: [app_net]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_ORIGINS: "*"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    volumes:
      - ollama_data:/root/.ollama
    networks: [app_net]
    restart: "no"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

networks:
  app_net:
    driver: bridge

volumes:
  db_data:
  app_output:
  app_uploads:
  app_logs:
  ollama_data:
